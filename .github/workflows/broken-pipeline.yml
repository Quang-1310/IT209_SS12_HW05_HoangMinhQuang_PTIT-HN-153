name: Repaired CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Fix 1: Git may not preserve the executable bit on gradlew.
      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      # Fix 2: Use the correctly named REGISTRY_TOKEN secret.
      - name: Log in to Docker Hub
        if: env.REGISTRY_USERNAME != '' && env.REGISTRY_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Fix 3: Both the build context and Dockerfile are at repository root.
      - name: Build and push Docker image
        if: env.REGISTRY_USERNAME != '' && env.REGISTRY_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/broken-pipeline:latest

      - name: Build Docker image without registry credentials
        if: env.REGISTRY_USERNAME == '' || env.REGISTRY_TOKEN == ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: broken-pipeline:ci
